<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="screen-orientation" content="portrait">
  <title>Naruto Hand Tracking</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      width: 100%;
      height: 100%;
      /* Prevent pull-to-refresh on mobile */
      overscroll-behavior: none;
      touch-action: none;
      /* Fix for iOS Safari 100vh issue */
      position: fixed;
      inset: 0;
    }

    #v_src {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    #out {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 2;
      pointer-events: none;
    }

    .darkness {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 4, 0, 0.25);
      mix-blend-mode: multiply;
      pointer-events: none;
      z-index: 5;
    }

    .fx {
      position: absolute;
      top: 0; left: 0;
      transform: translate(-50%, -50%);
      pointer-events: none;
      display: none;
      mix-blend-mode: screen;
      z-index: 20;
      height: auto;
      will-change: transform, opacity;
    }

    /* Responsive effect sizes based on viewport */
    #n { width: min(1400px, 90vw); }
    #s { width: min(2000px, 120vw); }

    /* ── Unlock overlay ── */
    #unlock-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2.5vh, 18px);
      cursor: pointer;
      transition: opacity 0.4s;
      /* Safe area for notched phones */
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    #unlock-overlay .icon {
      font-size: clamp(40px, 10vw, 64px);
      line-height: 1;
    }

    #unlock-overlay p {
      color: #fff;
      font-size: clamp(16px, 4vw, 22px);
      letter-spacing: 0.04em;
      opacity: 0.85;
      text-align: center;
      padding: 0 20px;
    }

    #unlock-overlay .hint {
      font-size: clamp(11px, 2.5vw, 14px);
      opacity: 0.5;
      color: #fff;
      text-align: center;
    }

    #unlock-overlay .btn {
      margin-top: 8px;
      padding: clamp(10px, 2vh, 14px) clamp(24px, 6vw, 40px);
      border: 1.5px solid rgba(255,255,255,0.5);
      border-radius: 40px;
      color: #fff;
      font-size: clamp(13px, 3vw, 16px);
      background: rgba(255,255,255,0.08);
      cursor: pointer;
      letter-spacing: 0.06em;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    #unlock-overlay .btn:hover,
    #unlock-overlay .btn:active {
      background: rgba(255,255,255,0.18);
    }

    /* ── HUD ── */
    #hud {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: clamp(16px, 4vw, 32px);
      z-index: 50;
      pointer-events: none;
      padding: 0 12px;
      width: auto;
      max-width: 90%;
    }

    .hud-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(3px, 0.8vh, 6px);
    }

    .hud-label {
      font-size: clamp(8px, 2vw, 11px);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.45);
      white-space: nowrap;
    }

    .hud-bar-bg {
      width: clamp(60px, 18vw, 100px);
      height: clamp(3px, 0.6vh, 5px);
      background: rgba(255,255,255,0.12);
      border-radius: 3px;
      overflow: hidden;
    }

    .hud-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 3px;
      transition: width 0.05s linear;
    }

    #bar-n { background: #f97316; }
    #bar-s { background: #38bdf8; }

    .hud-name {
      font-size: clamp(9px, 2.2vw, 12px);
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.6);
      white-space: nowrap;
    }

    /* ── Debug info (hidden by default) ── */
    #debug-info {
      position: fixed;
      top: env(safe-area-inset-top, 8px);
      right: 8px;
      z-index: 90;
      color: rgba(255,255,255,0.4);
      font-size: 10px;
      font-family: monospace;
      pointer-events: none;
      text-align: right;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Unlock screen -->
  <div id="unlock-overlay" role="dialog" aria-labelledby="unlock-title">
    <div class="icon" aria-hidden="true">🌀</div>
    <p id="unlock-title">Naruto Hand Tracking</p>
    <div class="hint">Requires camera + audio access</div>
    <div class="btn" role="button" tabindex="0">Tap to Begin</div>
  </div>

  <!-- Camera feed -->
  <video id="v_src" autoplay playsinline></video>
  <canvas id="out"></canvas>
  <div class="darkness"></div>

  <!-- Effects -->
  <video id="n" class="fx" src="assets/naruto.mp4" muted playsinline loop></video>
  <video id="s" class="fx" src="assets/sasuke.mp4" muted playsinline loop></video>

  <!-- Audio -->
  <audio id="rasengan" src="assets/rasengan.mp3" preload="auto"></audio>
  <audio id="chidori"  src="assets/chidori.mp3"  preload="auto"></audio>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-card">
      <div class="hud-label">Left hand</div>
      <div class="hud-bar-bg"><div class="hud-bar-fill" id="bar-n"></div></div>
      <div class="hud-name">Rasengan 🌀</div>
    </div>
    <div class="hud-card">
      <div class="hud-label">Right hand</div>
      <div class="hud-bar-bg"><div class="hud-bar-fill" id="bar-s"></div></div>
      <div class="hud-name">Chidori ⚡</div>
    </div>
  </div>

  <!-- Debug overlay -->
  <div id="debug-info"></div>

  <script>
  (() => {
    /* ── Device / Viewport Helpers ── */
    const dpr = window.devicePixelRatio || 1;
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

    // Get the TRUE viewport size (handles iOS Safari, notches, etc.)
    function getViewport() {
      // Use visualViewport API if available (handles keyboard, zoom)
      if (window.visualViewport) {
        return {
          w: window.visualViewport.width,
          h: window.visualViewport.height
        };
      }
      // Fallback: documentElement dimensions (more reliable than innerWidth/Height on some devices)
      return {
        w: document.documentElement.clientWidth  || window.innerWidth,
        h: document.documentElement.clientHeight || window.innerHeight
      };
    }

    // Determine camera resolution based on device capability
    function getCameraConfig() {
      const vp = getViewport();
      const maxDim = Math.max(vp.w, vp.h);

      if (isMobile) {
        // Mobile: use lower resolution to save performance
        if (maxDim <= 667) {
          // Small phones (iPhone SE, etc.)
          return { width: 640, height: 480 };
        }
        // Standard/large phones
        return { width: 960, height: 720 };
      }

      // Tablet
      if (maxDim <= 1024) {
        return { width: 1280, height: 720 };
      }

      // Desktop / laptop
      if (dpr >= 2 && maxDim >= 1440) {
        return { width: 1920, height: 1080 };
      }

      return { width: 1280, height: 720 };
    }

    /* ── DOM refs ── */
    const vEl      = document.getElementById('v_src');
    const cEl      = document.getElementById('out');
    const ctx      = cEl.getContext('2d');
    const nVid     = document.getElementById('n');
    const sVid     = document.getElementById('s');
    const rAud     = document.getElementById('rasengan');
    const cAud     = document.getElementById('chidori');
    const overlay  = document.getElementById('unlock-overlay');
    const barN     = document.getElementById('bar-n');
    const barS     = document.getElementById('bar-s');
    const debugEl  = document.getElementById('debug-info');

    /* ── MediaPipe drawing utilities (loaded via CDN script tags) ── */
    const drawConnectors = window.drawConnectors;
    const drawLandmarks  = window.drawLandmarks;
    const HAND_CONNECTIONS = window.HAND_CONNECTIONS;
    let mediaPipeReady = !!(drawConnectors && drawLandmarks && HAND_CONNECTIONS);
    if (!mediaPipeReady) {
      console.warn('MediaPipe drawing utilities not loaded. Skeleton overlay will be disabled.');
    }

    rAud.volume = 0.75;
    cAud.volume = 0.75;

    /* ── iOS-safe resize: fix the 100vh bug ── */
    function setFullViewport() {
      const vp = getViewport();
      document.documentElement.style.setProperty('--vh', vp.h + 'px');
      document.documentElement.style.setProperty('--vw', vp.w + 'px');

      // Force body to exact viewport
      document.body.style.width  = vp.w + 'px';
      document.body.style.height = vp.h + 'px';

      // Update video and canvas CSS sizes
      [vEl, cEl].forEach(el => {
        el.style.width  = vp.w + 'px';
        el.style.height = vp.h + 'px';
      });

      // Darkness layer too
      const darkness = document.querySelector('.darkness');
      if (darkness) {
        darkness.style.width  = vp.w + 'px';
        darkness.style.height = vp.h + 'px';
      }
    }

    setFullViewport();

    // Listen for resize, orientation change, visual viewport changes
    window.addEventListener('resize', setFullViewport);
    window.addEventListener('orientationchange', () => {
      setTimeout(setFullViewport, 150);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', setFullViewport);
    }

    /* ── Audio unlock ── */
    let audioUnlocked = false;
    let appDisabled = false;

    function unlockAudio() {
      if (audioUnlocked || appDisabled) return;
      audioUnlocked = true;

      // iOS requires audio play from a direct user gesture
      const unlockPromises = [rAud, cAud].map(a => {
        a.muted = false;
        return a.play().then(() => {
          a.pause();
          a.currentTime = 0;
        }).catch(() => {});
      });

      // Pre-load effect videos after audio is unlocked
      Promise.all(unlockPromises).then(() => {
        nVid.play().catch(() => {});
        sVid.play().catch(() => {});
      });

      // Use transitionend to avoid opacity/display conflict
      overlay.addEventListener('transitionend', function handler() {
        overlay.removeEventListener('transitionend', handler);
        overlay.style.display = 'none';
      });
      overlay.style.opacity = '0';
    }

    overlay.addEventListener('click', unlockAudio);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      unlockAudio();
    });
    overlay.querySelector('.btn').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        unlockAudio();
      }
    });

    /* ── State ── */
    const pwr        = { R: 0, L: 0 };
    const wasOpen    = { R: false, L: false };
    const audPlaying = { R: false, L: false };

    /* ── Landmark smoothing (EMA) ── */
    const EMA_SMOOTHING_FACTOR = 0.45;
    const prevLandmarks = {};
    const VIDEO_PAUSE_THRESHOLD = 0.05;

    function smoothLandmarks(key, pts) {
      if (!prevLandmarks[key]) {
        prevLandmarks[key] = pts.map(p => ({ x: p.x, y: p.y, z: p.z || 0 }));
        return pts;
      }
      const prev = prevLandmarks[key];
      const smoothed = pts.map((p, i) => ({
        x: prev[i].x + EMA_SMOOTHING_FACTOR * (p.x - prev[i].x),
        y: prev[i].y + EMA_SMOOTHING_FACTOR * (p.y - prev[i].y),
        z: prev[i].z + EMA_SMOOTHING_FACTOR * ((p.z || 0) - prev[i].z)
      }));
      prevLandmarks[key] = smoothed.map(p => ({ x: p.x, y: p.y, z: p.z }));
      return smoothed;
    }

    /* ── Frame rate limiting ── */
    const TARGET_FPS = 30;
    const FRAME_INTERVAL = 1000 / TARGET_FPS;
    let lastFrameTime = 0;

    /* ── Resize canvas to match video's intrinsic resolution (DPR-aware) ── */
    function syncCanvasSize() {
      if (vEl.videoWidth && vEl.videoHeight) {
        // Canvas drawing buffer = video resolution (no DPR scaling needed
        // because we draw at video resolution and CSS scales it)
        if (cEl.width !== vEl.videoWidth || cEl.height !== vEl.videoHeight) {
          cEl.width  = vEl.videoWidth;
          cEl.height = vEl.videoHeight;
        }
      }
    }

    vEl.addEventListener('loadedmetadata', () => {
      syncCanvasSize();
      setFullViewport();
    });

    /* ── Hand open / closed detection ── */
    function isHandOpen(pts) {
      const wrist = pts[0];
      let extended = 0;

      const tips = [8, 12, 16, 20];
      const pips = [6, 10, 14, 18];
      for (let i = 0; i < 4; i++) {
        const tipDist = Math.hypot(pts[tips[i]].x - wrist.x, pts[tips[i]].y - wrist.y);
        const pipDist = Math.hypot(pts[pips[i]].x - wrist.x, pts[pips[i]].y - wrist.y);
        if (tipDist > pipDist * 1.1) extended++;
      }

      const thumbExtended = Math.hypot(pts[4].x - pts[2].x, pts[4].y - pts[2].y) >
                            Math.hypot(pts[3].x - pts[2].x, pts[3].y - pts[2].y) * 1.15;

      return extended >= 3 || (extended >= 2 && thumbExtended);
    }

    /* ── Audio helpers ── */
    function playSound(aud, key) {
      if (audPlaying[key]) return;
      audPlaying[key] = true;
      aud.currentTime = 0;
      aud.play().catch(() => {});
      aud.onended = () => { audPlaying[key] = false; };
    }

    function stopSound(aud, key) {
      if (!audPlaying[key]) return;
      audPlaying[key] = false;
      aud.pause();
      aud.currentTime = 0;
    }

    /* ── Map normalised landmark coords → screen px ──
       This is the critical function for cross-device support.
       Must account for object-fit:cover behaviour at any aspect ratio.
    */
    function landmarkToScreen(nx, ny) {
      const vp = getViewport();
      const vw = vp.w;
      const vh = vp.h;

      // Video intrinsic aspect ratio
      const videoW = vEl.videoWidth  || 1280;
      const videoH = vEl.videoHeight || 720;
      const vr = videoW / videoH;
      const sr = vw / vh;

      let drawW, drawH, offX, offY;

      // object-fit: cover logic
      if (sr > vr) {
        // Viewport is wider than video → video width fills viewport, height crops
        drawW = vw;
        drawH = vw / vr;
        offX = 0;
        offY = (vh - drawH) / 2;
      } else {
        // Viewport is taller than video → video height fills viewport, width crops
        drawH = vh;
        drawW = vh * vr;
        offY = 0;
        offX = (vw - drawW) / 2;
      }

      // Mirror X (camera is CSS-mirrored, effects are NOT in canvas)
      const sx = offX + (1 - nx) * drawW;
      const sy = offY + ny * drawH;

      return { x: sx, y: sy };
    }

    /* ── Dynamic effect sizing based on viewport ── */
    function getEffectScale() {
      const vp = getViewport();
      const minDim = Math.min(vp.w, vp.h);

      if (minDim < 400) return 0.45;   // Small phone
      if (minDim < 600) return 0.6;    // Regular phone
      if (minDim < 900) return 0.8;    // Tablet
      return 1.0;                       // Desktop
    }

    /* ── Position and show an effect video ── */
    function showEffect(vid, wrist, knuckle, pval) {
      const mid = {
        x: (wrist.x + knuckle.x) / 2,
        y: (wrist.y + knuckle.y) / 2
      };
      const pos = landmarkToScreen(mid.x, mid.y);
      const scale = getEffectScale();
      const opacity = Math.min(1, pval * 1.4);

      vid.style.left      = pos.x + 'px';
      vid.style.top       = pos.y + 'px';
      vid.style.display   = 'block';
      vid.style.opacity   = opacity.toFixed(3);
      vid.style.transform = `translate(-50%, -50%) scale(${scale})`;

      // Resume video playback if it was paused for optimization
      if (vid.paused && opacity > VIDEO_PAUSE_THRESHOLD) {
        vid.play().catch(() => {});
      }
    }

    /* ── Hide and pause an effect video ── */
    function hideEffect(vid) {
      vid.style.display = 'none';
      if (!vid.paused) vid.pause();
    }

    /* ── MediaPipe results callback ── */
    function onResults(res) {
      syncCanvasSize();
      ctx.save();
      ctx.clearRect(0, 0, cEl.width, cEl.height);

      const seen = { R: false, L: false };

      // Scale landmarks drawing for DPR
      const lineW = Math.max(1, Math.round(3 * (isMobile ? 0.7 : 1)));
      const dotR  = Math.max(2, Math.round(3 * (isMobile ? 0.8 : 1)));

      if (res.multiHandLandmarks && res.multiHandedness) {
        for (let i = 0; i < res.multiHandLandmarks.length; i++) {
          const rawPts = res.multiHandLandmarks[i];
          const label  = res.multiHandedness[i].label;
          const key    = label === 'Right' ? 'R' : 'L';
          seen[key]    = true;

          const pts = smoothLandmarks(key, rawPts);

          ctx.save();
          ctx.shadowBlur  = isMobile ? 8 : 14;
          ctx.shadowColor = key === 'R' ? '#f97316' : '#38bdf8';
          if (mediaPipeReady) {
            drawConnectors(ctx, pts, HAND_CONNECTIONS, {
              color: key === 'R' ? '#fb923c' : '#7dd3fc',
              lineWidth: lineW
            });
            drawLandmarks(ctx, pts, {
              color: '#ffffff',
              fillColor: key === 'R' ? '#ea580c' : '#0284c7',
              lineWidth: 1,
              radius: dotR
            });
          }
          ctx.restore();

          const open = isHandOpen(pts);

          if (open) {
            pwr[key] = Math.min(1, pwr[key] + 0.06);
          } else {
            pwr[key] = Math.max(0, pwr[key] - 0.12);
          }

          if (open && !wasOpen[key]) {
            const vid = key === 'R' ? nVid : sVid;
            const aud = key === 'R' ? rAud : cAud;
            vid.currentTime = 0;
            vid.play().catch(() => {});
            playSound(aud, key);
          }

          if (!open && wasOpen[key]) {
            const aud = key === 'R' ? rAud : cAud;
            stopSound(aud, key);
          }

          wasOpen[key] = open;

          if (pwr[key] > 0.01) {
            const vid = key === 'R' ? nVid : sVid;
            showEffect(vid, pts[0], pts[9], pwr[key]);
          }
        }
      }

      for (const key of ['R', 'L']) {
        if (!seen[key]) {
          wasOpen[key] = false;
          pwr[key] = Math.max(0, pwr[key] - 0.18);
          delete prevLandmarks[key];

          const vid = key === 'R' ? nVid : sVid;
          const aud = key === 'R' ? rAud : cAud;

          if (pwr[key] > 0.01) {
            vid.style.opacity = Math.min(1, pwr[key] * 1.4).toFixed(3);
            // Pause video if opacity is very low to save resources
            if (pwr[key] < VIDEO_PAUSE_THRESHOLD && !vid.paused) vid.pause();
          } else {
            hideEffect(vid);
            stopSound(aud, key);
          }
        }
      }

      barN.style.width = (pwr['R'] * 100).toFixed(1) + '%';
      barS.style.width = (pwr['L'] * 100).toFixed(1) + '%';

      ctx.restore();
    }

    /* ── MediaPipe Hands setup ── */
    let hands;
    try {
      hands = new Hands({
        locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
      });

      hands.setOptions({
        maxNumHands: 2,
        modelComplexity: isMobile ? 0 : 1,
        minDetectionConfidence: isMobile ? 0.7 : 0.75,
        minTrackingConfidence:  isMobile ? 0.65 : 0.75
      });

      hands.onResults(onResults);
    } catch (err) {
      console.error('MediaPipe Hands failed to initialize:', err);
      appDisabled = true;
      overlay.querySelector('p').textContent = 'Hand tracking unavailable';
      overlay.querySelector('.hint').textContent = 'MediaPipe failed to load — please reload or try a different browser';
      overlay.querySelector('.btn').style.display = 'none';
    }

    /* ── Camera with device-appropriate resolution ── */
    function startCamera() {
      if (!hands || appDisabled) return;

      const camConfig = getCameraConfig();

      const cam = new Camera(vEl, {
        onFrame: async () => {
          const now = performance.now();
          if (now - lastFrameTime < FRAME_INTERVAL) return;
          lastFrameTime = now;
          await hands.send({ image: vEl });
        },
        width:  camConfig.width,
        height: camConfig.height,
        facingMode: 'user'
      });

      cam.start().catch(err => {
        console.warn('Camera start failed, retrying with lower resolution:', err);
        const fallbackCam = new Camera(vEl, {
          onFrame: async () => {
            const now = performance.now();
            if (now - lastFrameTime < FRAME_INTERVAL) return;
            lastFrameTime = now;
            await hands.send({ image: vEl });
          },
          width: 640,
          height: 480,
          facingMode: 'user'
        });
        fallbackCam.start().catch(e => {
          console.error('Camera failed completely:', e);
          appDisabled = true;
          overlay.style.display = 'flex';
          overlay.style.opacity = '1';
          overlay.querySelector('p').textContent = 'Camera access denied';
          overlay.querySelector('.hint').textContent = 'Please allow camera access and reload';
          overlay.querySelector('.btn').style.display = 'none';
        });
      });
    }

    startCamera();

    /* ── Prevent iOS elastic scroll / bounce ── */
    document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

    /* ── Wake lock to prevent screen dimming (if supported) ── */
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          await navigator.wakeLock.request('screen');
        } catch (e) { /* ignore */ }
      }
    }
    requestWakeLock();

    /* ── Consolidated visibility change handler ── */
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        // Pause audio and reset playback state
        [rAud, cAud].forEach(a => a.pause());
        audPlaying.R = false;
        audPlaying.L = false;
        // Pause effect videos when tab is hidden
        if (!nVid.paused) nVid.pause();
        if (!sVid.paused) sVid.pause();
      } else {
        requestWakeLock();
      }
    });

  })();
  </script>
